name: Bug report
description: Report a reproducible problem with Snipbird
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include clipboard contents, passwords, encryption keys, or personal information.
  - type: input
    id: version
    attributes:
      label: Snipbird version
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.6, MacBook Pro with Apple silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
